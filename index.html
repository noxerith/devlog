<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>devlog</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
        <style>
            *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

            :root {
                --bg: #111316;
                --bg2: #191b1f;
                --bg3: #21242a;
                --line: #2c3037;
                --line2: #3a4048;
                --text: #ece8df;
                --muted: #9b9a91;
                --dim: #5f625f;
                --accent: #e8a825;
                --accent2: #b07a10;
                --danger: #cf6868;
                --danger-bg: #1f0c0c;
            }

            body {
                font-family: "JetBrains Mono", monospace;
                background: var(--bg);
                color: var(--text);
                min-height: 100vh;
            }

            button, input, textarea { font: inherit; }
            button { cursor: pointer; }
            ::selection { background: rgba(232, 168, 37, .28); }
            ::-webkit-scrollbar { width: 8px; height: 8px; }
            ::-webkit-scrollbar-track { background: var(--bg); }
            ::-webkit-scrollbar-thumb { background: var(--line2); border-radius: 99px; }

            header {
                position: sticky;
                top: 0;
                z-index: 20;
                background: rgba(17, 19, 22, .96);
                border-bottom: 1px solid var(--line);
                padding: 16px 28px;
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 16px;
                backdrop-filter: blur(10px);
            }

            .logo { font-size: 15px; font-weight: 700; letter-spacing: .08em; color: var(--accent); white-space: nowrap; }
            .logo span { color: var(--dim); font-weight: 400; font-size: 12px; margin-left: 8px; }

            .btn {
                border-radius: 4px;
                font-size: 12px;
                letter-spacing: .05em;
                padding: 8px 14px;
                transition: border-color .15s, color .15s, background .15s;
                white-space: nowrap;
            }

            .btn-primary { background: var(--accent); border: 1px solid var(--accent); color: #101010; font-weight: 700; }
            .btn-primary:hover { background: var(--accent2); border-color: var(--accent2); }
            .btn-ghost { background: transparent; border: 1px solid var(--line2); color: var(--muted); }
            .btn-ghost:hover { border-color: var(--accent); color: var(--accent); }
            .btn-danger { background: transparent; border: 1px solid #452020; color: var(--danger); }
            .btn-danger:hover { background: var(--danger-bg); }
            .icon-btn { min-width: 34px; padding: 8px 10px; }

            .top-tools {
                display: grid;
                grid-template-columns: minmax(180px, 1fr) auto;
                gap: 12px;
                padding: 24px 28px 0;
            }

            .search-wrap {
                display: flex;
                align-items: center;
                gap: 10px;
                min-width: 0;
                background: var(--bg2);
                border: 1px solid var(--line);
                border-radius: 6px;
                padding: 0 12px;
            }

            .search-wrap span { color: var(--dim); font-size: 13px; }
            #search-input {
                width: 100%;
                min-width: 0;
                background: transparent;
                border: 0;
                outline: 0;
                color: var(--text);
                padding: 12px 0;
                font-size: 13px;
            }

            #active-filter {
                display: none;
                align-items: center;
                gap: 8px;
                background: var(--bg2);
                border: 1px solid var(--line);
                border-radius: 6px;
                color: var(--muted);
                padding: 0 10px;
                font-size: 12px;
                min-height: 42px;
            }

            #active-filter.visible { display: inline-flex; }
            #active-filter strong { color: var(--accent); font-weight: 500; }
            #clear-filter {
                border: 0;
                background: transparent;
                color: var(--dim);
                font-size: 16px;
                line-height: 1;
                padding: 2px;
            }

            #tag-filter-bar {
                display: flex;
                flex-wrap: wrap;
                gap: 6px;
                padding: 14px 28px 0;
            }

            .tag-filter {
                background: var(--bg2);
                border: 1px solid var(--line);
                border-radius: 4px;
                color: var(--muted);
                padding: 5px 9px;
                font-size: 11px;
                letter-spacing: .03em;
            }

            .tag-filter.active,
            .tag-filter:hover {
                border-color: var(--accent);
                color: var(--accent);
            }

            #view-list {
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
                gap: 16px;
                padding: 24px 28px 18px;
            }

            .card {
                min-height: 180px;
                background: var(--bg2);
                border: 1px solid var(--line);
                border-radius: 6px;
                padding: 20px;
                position: relative;
                transition: border-color .15s, transform .12s;
            }

            .card:hover { border-color: var(--accent2); transform: translateY(-2px); }
            .card-dot {
                position: absolute;
                top: 14px;
                right: 15px;
                width: 6px;
                height: 6px;
                border-radius: 99px;
                background: var(--line2);
            }

            .card:hover .card-dot { background: var(--accent); }
            .card-date { font-size: 11px; color: var(--dim); letter-spacing: .06em; margin-bottom: 10px; }
            .card-title { font-size: 15px; font-weight: 700; line-height: 1.45; margin-bottom: 8px; padding-right: 12px; }
            .card-preview {
                font-size: 12px;
                color: var(--muted);
                line-height: 1.65;
                display: -webkit-box;
                -webkit-line-clamp: 3;
                line-clamp: 3;
                -webkit-box-orient: vertical;
                overflow: hidden;
            }

            .tag-row { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 13px; }
            .tag {
                display: inline-block;
                background: var(--bg3);
                border: 1px solid var(--line);
                border-radius: 3px;
                color: var(--muted);
                font-size: 10px;
                padding: 2px 7px;
                letter-spacing: .04em;
            }

            .empty {
                grid-column: 1 / -1;
                color: var(--dim);
                text-align: center;
                padding: 80px 0;
                font-size: 13px;
                line-height: 2;
            }

            .list-footer {
                display: none;
                justify-content: center;
                padding: 0 28px 36px;
            }

            .list-footer.visible { display: flex; }

            #view-detail {
                display: none;
                max-width: 1180px;
                margin: 0 auto;
                padding: 36px 28px 80px;
            }

            .detail-grid {
                display: grid;
                grid-template-columns: minmax(0, 760px) minmax(190px, 240px);
                gap: 36px;
                align-items: start;
            }

            .detail-date { color: var(--dim); font-size: 11px; letter-spacing: .08em; margin: 18px 0 10px; }
            .detail-title { font-size: 27px; line-height: 1.3; margin-bottom: 14px; overflow-wrap: anywhere; }
            .divider { border: 0; border-top: 1px solid var(--line); margin: 22px 0; }
            .detail-body { color: var(--muted); font-size: 14px; line-height: 1.9; overflow-wrap: anywhere; }
            .detail-body h1, .detail-body h2, .detail-body h3 { color: var(--text); line-height: 1.35; margin: 26px 0 12px; }
            .detail-body h1 { font-size: 24px; }
            .detail-body h2 { font-size: 20px; }
            .detail-body h3 { font-size: 17px; }
            .detail-body p, .detail-body ul, .detail-body ol, .detail-body blockquote { margin: 12px 0; }
            .detail-body ul, .detail-body ol { padding-left: 22px; }
            .detail-body a { color: var(--accent); }
            .detail-body blockquote { border-left: 3px solid var(--accent2); padding-left: 14px; color: var(--muted); }
            .detail-body pre {
                background: #0d1117;
                border: 1px solid var(--line2);
                border-left: 3px solid var(--accent);
                border-radius: 5px;
                margin: 14px 0;
                overflow: auto;
            }
            .detail-body code { font-family: "JetBrains Mono", monospace; }
            .detail-body :not(pre) > code {
                background: var(--bg3);
                border: 1px solid var(--line);
                border-radius: 3px;
                color: var(--text);
                padding: 1px 5px;
                font-size: .92em;
            }
            .detail-body img { max-width: 100%; border-radius: 5px; border: 1px solid var(--line); margin: 12px 0; display: block; }

            .toc {
                position: sticky;
                top: 86px;
                border-left: 1px solid var(--line);
                padding-left: 15px;
                color: var(--dim);
                font-size: 12px;
                max-height: calc(100vh - 120px);
                overflow: auto;
            }

            .toc-title { color: var(--muted); font-size: 11px; letter-spacing: .08em; margin-bottom: 10px; }
            .toc a {
                display: block;
                color: var(--dim);
                text-decoration: none;
                line-height: 1.5;
                padding: 4px 0;
                overflow-wrap: anywhere;
            }
            .toc a:hover { color: var(--accent); }
            .toc .h2 { padding-left: 10px; }
            .toc .h3 { padding-left: 20px; }
            .toc.empty { display: none; }

            #section-read, #section-edit { display: none; }
            .action-row { display: flex; gap: 9px; justify-content: flex-end; margin-top: 24px; flex-wrap: wrap; }

            #editor-title {
                width: 100%;
                background: transparent;
                border: 0;
                border-bottom: 1px solid var(--line);
                color: var(--text);
                outline: 0;
                font-size: 22px;
                font-weight: 700;
                padding: 8px 0 12px;
                margin-bottom: 16px;
            }

            .editor-tabs {
                display: flex;
                gap: 6px;
                margin-bottom: 10px;
            }

            .tab-btn {
                background: transparent;
                border: 1px solid var(--line2);
                color: var(--muted);
                border-radius: 4px;
                padding: 6px 10px;
                font-size: 11px;
                letter-spacing: .05em;
            }

            .tab-btn.active { border-color: var(--accent); color: var(--accent); }

            .editor-pane {
                display: grid;
                grid-template-columns: minmax(0, 1fr);
                gap: 12px;
            }

            .editor-pane.split { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }

            #editor-body {
                width: 100%;
                min-height: 420px;
                resize: vertical;
                background: var(--bg2);
                border: 1px solid var(--line);
                border-radius: 5px;
                color: var(--text);
                outline: 0;
                padding: 16px;
                font-size: 14px;
                line-height: 1.8;
            }

            #editor-preview {
                display: none;
                min-height: 420px;
                background: var(--bg2);
                border: 1px solid var(--line);
                border-radius: 5px;
                padding: 16px;
                overflow: auto;
            }

            .editor-pane.preview #editor-body { display: none; }
            .editor-pane.preview #editor-preview,
            .editor-pane.split #editor-preview { display: block; }

            .tag-input-row {
                display: flex;
                align-items: center;
                flex-wrap: wrap;
                gap: 6px;
                border: 1px solid var(--line);
                border-radius: 5px;
                padding: 8px 10px;
                margin-top: 14px;
                min-height: 42px;
                cursor: text;
            }

            .tag-chip {
                display: inline-flex;
                align-items: center;
                gap: 5px;
                background: var(--bg3);
                border: 1px solid var(--line2);
                border-radius: 3px;
                font-size: 11px;
                color: var(--muted);
                padding: 2px 8px;
            }

            .tag-chip button { background: transparent; border: 0; color: var(--dim); font-size: 13px; line-height: 1; }
            .tag-chip button:hover { color: var(--danger); }
            #tag-input {
                min-width: 120px;
                flex: 1;
                background: transparent;
                border: 0;
                outline: 0;
                color: var(--text);
                font-size: 12px;
                padding: 4px 0;
            }

            #login-screen {
                position: fixed;
                inset: 0;
                z-index: 1000;
                background: var(--bg);
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 20px;
            }

            .login-box { width: min(320px, 100%); text-align: center; }
            .login-box h1 { color: var(--accent); font-size: 18px; margin-bottom: 18px; letter-spacing: .08em; }
            #pw-input {
                width: 100%;
                background: var(--bg2);
                border: 1px solid var(--line);
                border-radius: 5px;
                color: var(--text);
                padding: 12px;
                text-align: center;
                outline: 0;
                margin-bottom: 10px;
            }
            #pw-input:focus { border-color: var(--accent); }

            #modal {
                display: none;
                position: fixed;
                inset: 0;
                background: rgba(0, 0, 0, .74);
                z-index: 100;
                align-items: center;
                justify-content: center;
                padding: 18px;
            }
            #modal.open { display: flex; }
            .modal-box {
                width: min(420px, 100%);
                background: var(--bg2);
                border: 1px solid var(--line);
                border-radius: 8px;
                padding: 28px;
            }
            .modal-title { font-size: 15px; font-weight: 700; margin-bottom: 8px; }
            .modal-sub { color: var(--muted); font-size: 12px; line-height: 1.7; margin-bottom: 22px; }
            .modal-actions { display: flex; gap: 10px; justify-content: flex-end; }

            #toast {
                display: none;
                position: fixed;
                right: 24px;
                bottom: 24px;
                z-index: 2000;
                background: var(--bg3);
                border: 1px solid var(--accent);
                border-radius: 5px;
                color: var(--accent);
                padding: 10px 15px;
                font-size: 12px;
                max-width: min(360px, calc(100vw - 36px));
            }

            @media (max-width: 820px) {
                header { padding: 14px 16px; }
                .logo span { display: none; }
                .top-tools { grid-template-columns: 1fr; padding: 18px 16px 0; }
                #tag-filter-bar, #view-list { padding-left: 16px; padding-right: 16px; }
                #view-detail { padding: 26px 16px 70px; }
                .detail-grid { grid-template-columns: 1fr; }
                .toc { display: none; }
                .editor-pane.split { grid-template-columns: 1fr; }
                #editor-body, #editor-preview { min-height: 340px; }
            }
        </style>
    </head>
    <body>
        <div id="login-screen">
            <div class="login-box">
                <h1>ACCESS RESTRICTED</h1>
                <input type="password" id="pw-input" placeholder="PASSWORD" autocomplete="off">
                <button class="btn btn-primary" id="btn-login">UNLOCK</button>
            </div>
        </div>

        <header>
            <div class="logo">devlog <span>// private journal</span></div>
            <button class="btn btn-primary" id="btn-new">+ 새 일지</button>
        </header>

        <main>
            <section id="list-tools">
                <div class="top-tools">
                <label class="search-wrap">
                    <span>⌕</span>
                    <input id="search-input" type="search" placeholder="제목, 본문, 태그 검색" autocomplete="off">
                </label>
                <div id="active-filter">
                    <span>태그</span>
                    <strong id="active-filter-name"></strong>
                    <button id="clear-filter" title="필터 해제" type="button">×</button>
                </div>
                </div>
                <div id="tag-filter-bar"></div>
            </section>

            <section id="view-list"></section>
            <div class="list-footer" id="list-footer">
                <button class="btn btn-ghost" id="btn-more">더 보기</button>
            </div>

            <section id="view-detail">
                <button class="btn btn-ghost" id="btn-back">← 목록으로</button>

                <div id="section-read">
                <div class="detail-grid">
                    <article>
                    <div class="detail-date" id="detail-date"></div>
                    <h1 class="detail-title" id="detail-title"></h1>
                    <div class="tag-row" id="detail-tags"></div>
                    <hr class="divider">
                    <div class="detail-body" id="detail-body"></div>
                    <div class="action-row">
                        <button class="btn btn-danger" id="btn-delete">삭제</button>
                        <button class="btn btn-ghost" id="btn-edit">수정</button>
                    </div>
                    </article>
                    <aside class="toc" id="toc"></aside>
                </div>
                </div>

                <div id="section-edit">
                <input id="editor-title" placeholder="제목" autocomplete="off">

                <div class="editor-tabs">
                    <button class="tab-btn active" type="button" data-mode="write">작성</button>
                    <button class="tab-btn" type="button" data-mode="preview">미리보기</button>
                    <button class="tab-btn" type="button" data-mode="split">분할</button>
                </div>

                <div class="editor-pane" id="editor-pane">
                    <textarea id="editor-body" spellcheck="false" placeholder="# 오늘의 개발 일지&#10;&#10;```js&#10;console.log('hello devlog');&#10;```"></textarea>
                    <div class="detail-body" id="editor-preview"></div>
                </div>

                <div class="tag-input-row" id="tag-input-row">
                    <span id="tag-chips"></span>
                    <input id="tag-input" placeholder="태그 입력 후 Enter  예: react, bug-fix">
                </div>

                <div class="action-row">
                    <button class="btn btn-ghost" id="btn-cancel">취소</button>
                    <button class="btn btn-primary" id="btn-save">저장</button>
                </div>
                </div>
            </section>
        </main>

        <div id="modal">
        <div class="modal-box">
            <div class="modal-title">일지를 삭제할까요?</div>
            <div class="modal-sub" id="modal-sub"></div>
            <div class="modal-actions">
            <button class="btn btn-ghost" id="modal-cancel">취소</button>
            <button class="btn btn-danger" id="modal-confirm">삭제</button>
            </div>
        </div>
        </div>

        <div id="toast"></div>

        <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.11/purify.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
        <script>
            const API_BASE = "https://devlog-api.corskep.workers.dev";
            const PAGE_SIZE = 20;

            let entries = [];
            let currentId = null;
            let editTags = [];
            let toastTimer = null;
            let activeTag = "";
            let visibleCount = PAGE_SIZE;

            marked.setOptions({
                breaks: true,
                highlight(code, lang) {
                const language = hljs.getLanguage(lang) ? lang : "plaintext";
                return hljs.highlight(code, { language }).value;
                }
            });

            const $ = id => document.getElementById(id);

            function toast(msg) {
                const el = $("toast");
                el.textContent = msg;
                el.style.display = "block";
                clearTimeout(toastTimer);
                toastTimer = setTimeout(() => el.style.display = "none", 2200);
            }

            function esc(str = "") {
                return String(str)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;");
            }

            function fmtDate(ts) {
                return new Date(ts).toLocaleDateString("ko-KR", {
                year: "numeric",
                month: "2-digit",
                day: "2-digit"
                }).replace(/\. /g, "-").replace(".", "");
            }

            function renderMarkdown(source = "") {
                return DOMPurify.sanitize(marked.parse(source));
            }

            function renderEntryBody(entry) {
                if (entry.format === "markdown") return renderMarkdown(entry.body || "");
                return DOMPurify.sanitize(entry.body || "");
            }

            function bodyText(entry) {
                const tmp = document.createElement("div");
                tmp.innerHTML = renderEntryBody(entry);
                return tmp.textContent.replace(/\s+/g, " ").trim();
            }

            function preview(entry) {
                return bodyText(entry).slice(0, 110) || "내용 없음";
            }

            function htmlToMarkdownLite(html = "") {
                const tmp = document.createElement("div");
                tmp.innerHTML = DOMPurify.sanitize(html);
                tmp.querySelectorAll("pre").forEach(pre => {
                pre.textContent = "\\n```\\n" + pre.textContent.trim() + "\\n```\\n";
                });
                return tmp.textContent.replace(/\n{3,}/g, "\n\n").trim();
            }

            function getFilteredEntries() {
                const q = $("search-input").value.trim().toLowerCase();
                return entries.filter(entry => {
                const tags = entry.tags || [];
                const tagOk = !activeTag || tags.includes(activeTag);
                if (!tagOk) return false;

                if (!q) return true;
                const haystack = [
                    entry.title || "",
                    bodyText(entry),
                    tags.join(" ")
                ].join(" ").toLowerCase();
                return haystack.includes(q);
                });
            }

            function renderTagFilters() {
                const counts = new Map();
                entries.forEach(entry => {
                (entry.tags || []).forEach(tag => counts.set(tag, (counts.get(tag) || 0) + 1));
                });

                const tags = [...counts.entries()].sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]));
                $("tag-filter-bar").innerHTML = tags.map(([tag, count]) => `
                <button class="tag-filter ${activeTag === tag ? "active" : ""}" type="button" data-tag="${esc(tag)}">
                    #${esc(tag)} ${count}
                </button>
                `).join("");

                $("tag-filter-bar").querySelectorAll(".tag-filter").forEach(btn => {
                btn.addEventListener("click", () => {
                    activeTag = btn.dataset.tag;
                    visibleCount = PAGE_SIZE;
                    renderList();
                });
                });

                $("active-filter").classList.toggle("visible", !!activeTag);
                $("active-filter-name").textContent = activeTag ? `#${activeTag}` : "";
            }

            function renderList() {
                const filtered = getFilteredEntries();
                const visible = filtered.slice(0, visibleCount);
                renderTagFilters();

                if (!visible.length) {
                $("view-list").innerHTML = `
                    <div class="empty">
                    <div>[ ]</div>
                    <div>조건에 맞는 일지가 없습니다.</div>
                    </div>
                `;
                } else {
                $("view-list").innerHTML = visible.map(entry => {
                    const tags = (entry.tags || []).map(tag => `<span class="tag">#${esc(tag)}</span>`).join("");
                    return `
                    <article class="card" data-id="${esc(entry.id)}">
                        <div class="card-dot"></div>
                        <div class="card-date">${fmtDate(entry.createdAt)}</div>
                        <h2 class="card-title">${esc(entry.title)}</h2>
                        <div class="card-preview">${esc(preview(entry))}</div>
                        ${tags ? `<div class="tag-row">${tags}</div>` : ""}
                    </article>
                    `;
                }).join("");
                }

                $("view-list").querySelectorAll(".card").forEach(card => {
                card.addEventListener("click", () => showDetail(card.dataset.id));
                });

                $("list-footer").classList.toggle("visible", filtered.length > visibleCount);
            }

            function showList() {
                currentId = null;
                $("btn-new").style.display = "";
                $("list-tools").style.display = "block";
                $("view-list").style.display = "grid";
                $("view-detail").style.display = "none";
                renderList();
            }

            function showDetail(id) {
                currentId = id;
                $("btn-new").style.display = "none";
                $("list-tools").style.display = "none";
                $("view-list").style.display = "none";
                $("list-footer").classList.remove("visible");
                $("view-detail").style.display = "block";
                if (id) renderRead();
                else renderEdit(null);
            }

            function renderRead() {
                const entry = entries.find(x => x.id === currentId);
                if (!entry) { showList(); return; }

                $("section-read").style.display = "block";
                $("section-edit").style.display = "none";
                $("detail-date").innerHTML = entry.updatedAt !== entry.createdAt
                ? `${fmtDate(entry.createdAt)} <span style="color:var(--dim);margin-left:10px">수정 ${fmtDate(entry.updatedAt)}</span>`
                : fmtDate(entry.createdAt);
                $("detail-title").textContent = entry.title;
                $("detail-tags").innerHTML = (entry.tags || [])
                .map(tag => `<button class="tag tag-link" type="button" data-tag="${esc(tag)}">#${esc(tag)}</button>`)
                .join("");
                $("detail-body").innerHTML = renderEntryBody(entry);

                $("detail-tags").querySelectorAll(".tag-link").forEach(btn => {
                btn.addEventListener("click", () => {
                    activeTag = btn.dataset.tag;
                    visibleCount = PAGE_SIZE;
                    showList();
                });
                });

                highlightCode($("detail-body"));
                renderToc();
            }

            function renderToc() {
                const headings = [...$("detail-body").querySelectorAll("h1, h2, h3")];
                if (!headings.length) {
                $("toc").classList.add("empty");
                $("toc").innerHTML = "";
                return;
                }

                headings.forEach((heading, index) => {
                if (!heading.id) heading.id = `heading-${index + 1}`;
                });

                $("toc").classList.remove("empty");
                $("toc").innerHTML = `
                <div class="toc-title">CONTENTS</div>
                ${headings.map(heading => `
                    <a class="${heading.tagName.toLowerCase()}" href="#${heading.id}">${esc(heading.textContent)}</a>
                `).join("")}
                `;
            }

            function renderEdit(id) {
                const entry = id ? entries.find(x => x.id === id) : null;
                $("section-read").style.display = "none";
                $("section-edit").style.display = "block";
                $("editor-title").value = entry ? entry.title : "";
                $("editor-body").value = entry
                ? (entry.format === "markdown" ? entry.body : htmlToMarkdownLite(entry.body))
                : "";
                editTags = entry ? [...(entry.tags || [])] : [];
                setEditorMode("write");
                renderTagChips();
                updatePreview();
                $("editor-title").focus();
            }

            function setEditorMode(mode) {
                const pane = $("editor-pane");
                pane.className = "editor-pane";
                if (mode !== "write") pane.classList.add(mode);
                document.querySelectorAll(".tab-btn").forEach(btn => {
                btn.classList.toggle("active", btn.dataset.mode === mode);
                });
                if (mode !== "write") updatePreview();
            }

            function updatePreview() {
                $("editor-preview").innerHTML = renderMarkdown($("editor-body").value);
                highlightCode($("editor-preview"));
            }

            function highlightCode(root) {
                root.querySelectorAll("pre code").forEach(block => hljs.highlightElement(block));
            }

            function renderTagChips() {
                $("tag-chips").innerHTML = editTags.map((tag, index) => `
                <span class="tag-chip">#${esc(tag)}<button type="button" data-index="${index}">×</button></span>
                `).join("");
                $("tag-chips").querySelectorAll("button").forEach(btn => {
                btn.addEventListener("click", event => {
                    event.stopPropagation();
                    editTags.splice(Number(btn.dataset.index), 1);
                    renderTagChips();
                });
                });
            }

            function addTag(raw) {
                const tag = raw.trim().replace(/^#+/, "").replace(/\s+/g, "-").toLowerCase();
                if (!tag || editTags.includes(tag)) return;
                editTags.push(tag);
                renderTagChips();
            }

            async function load() {
                try {
                const res = await fetch(`${API_BASE}/api/entries`);
                const data = await res.json();
                entries = (data.entries || []).filter(entry => entry.id);
                entries.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
                renderList();
                } catch {
                toast("데이터를 불러오지 못했습니다.");
                }
            }

            async function save() {
                const res = await fetch(`${API_BASE}/api/entries`, {
                method: "PUT",
                headers: {
                    "Content-Type": "application/json",
                    "Authorization": `Bearer ${sessionStorage.getItem("devlog_token") || ""}`
                },
                body: JSON.stringify({ entries })
                });

                if (!res.ok) throw new Error("save failed");
            }

            $("btn-login").addEventListener("click", async () => {
                try {
                const res = await fetch(`${API_BASE}/api/login`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ password: $("pw-input").value })
                });

                if (!res.ok) {
                    toast("비밀번호가 틀렸습니다.");
                    return;
                }

                const data = await res.json();
                sessionStorage.setItem("devlog_auth", "true");
                sessionStorage.setItem("devlog_token", data.token);
                $("login-screen").style.display = "none";
                await load();
                showList();
                toast("반갑습니다.");
                } catch {
                toast("로그인 요청에 실패했습니다.");
                }
            });

            $("pw-input").addEventListener("keydown", event => {
                if (event.key === "Enter") $("btn-login").click();
            });

            $("btn-new").addEventListener("click", () => showDetail(null));
            $("btn-back").addEventListener("click", showList);
            $("btn-edit").addEventListener("click", () => renderEdit(currentId));
            $("btn-cancel").addEventListener("click", () => currentId ? renderRead() : showList());
            $("btn-more").addEventListener("click", () => {
                visibleCount += PAGE_SIZE;
                renderList();
            });

            $("search-input").addEventListener("input", () => {
                visibleCount = PAGE_SIZE;
                renderList();
            });

            $("clear-filter").addEventListener("click", () => {
                activeTag = "";
                visibleCount = PAGE_SIZE;
                renderList();
            });

            document.querySelectorAll(".tab-btn").forEach(btn => {
                btn.addEventListener("click", () => setEditorMode(btn.dataset.mode));
            });

            $("editor-body").addEventListener("input", updatePreview);

            $("tag-input-row").addEventListener("click", () => $("tag-input").focus());
            $("tag-input").addEventListener("keydown", event => {
                const val = event.target.value;
                if (event.key === "Enter" || event.key === ",") {
                event.preventDefault();
                addTag(val);
                event.target.value = "";
                } else if (event.key === "Backspace" && !val && editTags.length) {
                editTags.pop();
                renderTagChips();
                }
            });
            $("tag-input").addEventListener("blur", event => {
                if (event.target.value.trim()) {
                addTag(event.target.value);
                event.target.value = "";
                }
            });

            $("btn-save").addEventListener("click", async () => {
                const title = $("editor-title").value.trim();
                const tagInput = $("tag-input");
                if (tagInput.value.trim()) {
                addTag(tagInput.value);
                tagInput.value = "";
                }

                if (!title) {
                toast("제목을 입력해주세요.");
                return;
                }

                const now = Date.now();
                const body = $("editor-body").value;
                if (currentId) {
                entries = entries.map(entry => entry.id === currentId
                    ? { ...entry, title, body, format: "markdown", tags: [...editTags], updatedAt: now }
                    : entry
                );
                } else {
                currentId = String(now);
                entries.unshift({
                    id: currentId,
                    title,
                    body,
                    format: "markdown",
                    tags: [...editTags],
                    createdAt: now,
                    updatedAt: now
                });
                }

                try {
                await save();
                renderRead();
                toast("저장되었습니다.");
                } catch {
                toast("저장에 실패했습니다. 다시 로그인해보세요.");
                }
            });

            $("btn-delete").addEventListener("click", () => {
                const entry = entries.find(x => x.id === currentId);
                $("modal-sub").innerHTML = `"${esc(entry?.title || "")}"<br>삭제한 일지는 복구할 수 없습니다.`;
                $("modal").classList.add("open");
            });

            $("modal-cancel").addEventListener("click", () => $("modal").classList.remove("open"));
            $("modal").addEventListener("click", event => {
                if (event.target === $("modal")) $("modal").classList.remove("open");
            });

            $("modal-confirm").addEventListener("click", async () => {
                entries = entries.filter(entry => entry.id !== currentId);
                try {
                await save();
                $("modal").classList.remove("open");
                showList();
                toast("삭제되었습니다.");
                } catch {
                toast("삭제 저장에 실패했습니다.");
                }
            });

            (() => {
                if (API_BASE.includes("YOUR-WORKER")) {
                toast("API_BASE에 Worker 주소를 넣어주세요.");
                }

                if (sessionStorage.getItem("devlog_auth") === "true" && sessionStorage.getItem("devlog_token")) {
                $("login-screen").style.display = "none";
                load();
                showList();
                } else {
                $("login-screen").style.display = "flex";
                }
            })();
        </script>
    </body>
</html>
